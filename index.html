<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zvířata světa</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f1f8e9; }
        h1 { color: #689f38; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        ul { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Zvířata světa</h1>
        <p>Úžasná stvoření přírody.</p>
        <h2>Zajímavé fakty:</h2>
        <ul>
            <li>Slon je největší suchozemské zvíře.</li>
            <li>Koaly spí až 20 hodin denně.</li>
            <li>Tučňáci mohou plavat rychlostí 36 km/h.</li>
            <li>Velryby zpívají písně.</li>
        </ul>
        <p>Chraňte přírodu!</p>
    </div>
</body>
</html>
